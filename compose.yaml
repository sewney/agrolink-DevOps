services:

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: agrolink-web
    ports:
      - "80:80"
    environment:
      DBHOST: db
      DBNAME: agrolink
      DBUSER: root
      DBPASS: "${MYSQL_ROOT_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0.45
    container_name: agrolink-db
    environment:
      MYSQL_DATABASE: agrolink
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    volumes:
      - ./app/database/agrolink.sql:/docker-entrypoint-initdb.d/agrolink.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mysql_data: